name: Update Profile Stats

on:
  schedule:
    # Runs twice every day (every 12 hours at midnight and noon UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Gotham Stats Card
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/generate_stats.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/github-stats.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update profile stats [skip ci]"
            git push
          else
            echo "No stats changes to commit."
          fi
