<svg xmlns="http://www.w3.org/2000/svg" width="890" height="480" viewBox="0 0 890 480" fill="none" role="img" aria-label="GitHub Profile Statistics for Vedant Chaudhari">
  <defs>
    <!-- Mask for fire icon resting on top of streak ring (tmp/card.php) -->
    <mask id="mask_out_ring_behind_fire">
      <rect width="890" height="480" fill="white"/>
      <ellipse cx="667" cy="42" rx="14" ry="18" fill="black"/>
    </mask>

    <!-- Clip path for smooth monthly chart reveal wipe -->
    <clipPath id="chart_reveal_clip">
      <rect class="chart-wipe" x="30" y="255" width="815" height="110" />
    </clipPath>
  </defs>

  <style>
    .header {
      font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      font-size: 24px;
      font-weight: 700;
      fill: #00A375;
      animation: fadeIn 0.6s ease-in-out forwards;
    }

    .section-header {
      font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #00A375;
      animation: fadeIn 0.6s ease-in-out forwards;
    }

    .caption {
      font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      font-size: 11px;
      fill: #80CBC4;
    }

    .font-stat {
      font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      font-size: 13px;
      fill: #80CBC4;
    }

    .bold {
      font-weight: 600;
      fill: #80CBC4;
    }

    .val {
      font-weight: 700;
      fill: #E0F2F1;
    }

    .icon {
      fill: #00A375;
    }

    /* Staggered Fade-in */
    .stagger {
      opacity: 0;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Ranking Circle Animations (AwesomeGithubStats) */
    .rank-circle-rim {
      stroke: #00573F;
      fill: none;
      stroke-width: 6;
      opacity: 0.2;
    }

    .rank-circle {
      stroke: #00A375;
      stroke-dasharray: 0, 20000;
      fill: none;
      stroke-width: 6;
      opacity: 0;
      stroke-linecap: round;
      animation: rankAnimation 3s ease-in-out 0.6s forwards, fadeIn 0.3s ease-in-out 0.6s forwards;
    }

    @keyframes rankAnimation {
      from { stroke-dasharray: 0, 2000; }
      to { stroke-dasharray: 154.57, 2000; }
    }

    .rank-text {
      font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
      font-size: 46px;
      font-weight: 800;
      stroke-width: 1.5;
      stroke: #00A375;
      fill: #00A375;
      animation: stroke 4.5s alternate forwards;
    }

    @keyframes stroke {
      0% {
        fill: rgba(0, 163, 117, 0);
        stroke: #00A375;
        stroke-dashoffset: 25%;
        stroke-dasharray: 0 50%;
        stroke-width: 2;
      }
      70% {
        fill: rgba(0, 163, 117, 0);
        stroke: #00A375;
      }
      80% {
        fill: rgba(0, 163, 117, 0);
        stroke: #00A375;
        stroke-width: 3;
      }
      100% {
        fill: #00A375;
        stroke: #00A375;
        stroke-dashoffset: -25%;
        stroke-dasharray: 50% 0;
        stroke-width: 0;
      }
    }

    /* Streak Animations */
    @keyframes currstreak {
      0% { font-size: 3px; opacity: 0.2; }
      80% { font-size: 34px; opacity: 1; }
      100% { font-size: 28px; opacity: 1; }
    }

    /* Chart Wipe-in Animation */
    .chart-wipe {
      animation: chartWipeAnim 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    @keyframes chartWipeAnim {
      from { width: 0; }
      to { width: 815px; }
    }

    .lang-seg {
      animation: fadeIn 0.8s ease-in-out 0.5s forwards;
    }
  </style>

  <!-- Solid Clean Gotham Outer Border -->
  <rect x="0.5" y="0.5" width="889" height="479" rx="6" fill="#000B0B" stroke="#00573F" stroke-width="1" />

  <!-- ==================== SECTION 1: TOP (OVERVIEW + STREAKS) ==================== -->
  <!-- Name Header -->
  <text class="header" x="25" y="38">Vedant Chaudhari</text>

  <!-- Overview Stats Rows -->
  <g transform="translate(0, 56)">
    <!-- Row 1: Total Stars -->
    <g class="stagger" style="animation-delay: 200ms;" transform="translate(25, 0)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25zm0 2.445L6.615 5.5a.75.75 0 01-.564.41l-3.097.45 2.24 2.184a.75.75 0 01.216.664l-.528 3.084 2.769-1.456a.75.75 0 01.698 0l2.77 1.456-.53-3.084a.75.75 0 01.216-.664l2.24-2.183-3.096-.45a.75.75 0 01-.564-.41L8 2.694v.001z"/>
      </svg>
